name: Platform CI - Build & Integration Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  # ---------------------------------------------------------------------------
  # Phase 1: Lint & Code Style Checks
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Code Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Root Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          elif [ -f "package.json" ]; then
            npm install
          fi

      - name: Run Linter
        run: |
          if [ -f "package.json" ]; then
            npm run lint --if-present
          fi

  # ---------------------------------------------------------------------------
  # Phase 2: Parallel Container Builds with GHA Layer Caching
  # ---------------------------------------------------------------------------
  build-services:
    name: Build Image - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user_service
          - submitter_service
          - event_store_service
          - investigation_service
          - voter_service
          - decision_maker_service
          - notification_service
          - attachment_service
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Root Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          elif [ -f "package.json" ]; then
            npm install
          fi

      - name: Stage Service Assets for Build Context
        run: |
          # Ensure openapi.yaml is at root context if Dockerfile copies it from root
          if [ -f "./services/${{ matrix.service }}/openapi.yaml" ]; then
            cp "./services/${{ matrix.service }}/openapi.yaml" ./openapi.yaml
          fi

          # Ensure fallback .env exists at root and in service dir
          touch .env
          if [ -f "./services/${{ matrix.service }}/.env.example" ]; then
            cp "./services/${{ matrix.service }}/.env.example" ./services/${{ matrix.service }}/.env
          else
            touch "./services/${{ matrix.service }}/.env"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Cache Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ matrix.service }}:latest
          outputs: type=docker,dest=/tmp/${{ matrix.service }}.tar
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}.tar
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Phase 3: E2E Integration Suite Execution
  # ---------------------------------------------------------------------------
  e2e-test:
    name: Run 7-Stage E2E Integration Suite
    needs: [lint, build-services]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          elif [ -f "package.json" ]; then
            npm install
          fi

      - name: Download Built Images
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: /tmp/images
          merge-multiple: true

      - name: Load Docker Images into Engine
        run: |
          for img in /tmp/images/*.tar; do
            echo "Loading $img..."
            docker load -i "$img"
          done

      - name: Launch Postgres Database
        run: |
          docker network create marad_ccb_network || true

          docker run -d \
            --name marad_ccb_postgres \
            --network marad_ccb_network \
            -e POSTGRES_DB=marad_ccb_db \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -v ${{ github.workspace }}/00_init_roles.sql:/docker-entrypoint-initdb.d/00_init_roles.sql:ro \
            -v ${{ github.workspace }}/init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro \
            -p 5432:5432 \
            postgres:15-alpine

          RETRIES=20
          until docker exec marad_ccb_postgres pg_isready -U postgres -d marad_ccb_db || [ $RETRIES -eq 0 ]; do
            echo "Waiting for postgres initialization... ($RETRIES retries left)"
            sleep 2
            RETRIES=$((RETRIES-1))
          done

          if [ $RETRIES -eq 0 ]; then
            echo "::error::Postgres failed to initialize or exited prematurely."
            echo "=== Postgres Startup Logs ==="
            docker logs marad_ccb_postgres
            exit 1
          fi

      - name: Start Microservices Stack
        env:
          DATABASE_URL: postgresql://postgres:postgres@marad_ccb_postgres:5432/marad_ccb_db
        run: |
          docker run -d --name event_store_service --network marad_ccb_network -e DATABASE_URL=$DATABASE_URL -p 3001:3001 event_store_service:latest
          docker run -d --name user_service --network marad_ccb_network -e DATABASE_URL=$DATABASE_URL -p 3002:3002 user_service:latest
          docker run -d --name submitter_service --network marad_ccb_network -e DATABASE_URL=$DATABASE_URL -p 3003:3003 submitter_service:latest
          docker run -d --name investigation_service --network marad_ccb_network -e DATABASE_URL=$DATABASE_URL -p 3004:3004 investigation_service:latest
          docker run -d --name voter_service --network marad_ccb_network -e DATABASE_URL=$DATABASE_URL -p 3005:3005 voter_service:latest
          docker run -d --name decision_maker_service --network marad_ccb_network -e DATABASE_URL=$DATABASE_URL -p 3006:3006 decision_maker_service:latest
          docker run -d --name notification_service --network marad_ccb_network -e DATABASE_URL=$DATABASE_URL -p 3007:3007 notification_service:latest
          docker run -d --name attachment_service --network marad_ccb_network -e DATABASE_URL=$DATABASE_URL -p 3008:3008 attachment_service:latest

          sleep 5

      - name: Execute End-to-End Test Suite
        run: npx jest tests/e2e/caseLifecycle.e2e.test.js --runInBand --verbose

      - name: Dump Container Logs on Failure
        if: always()
        run: |
          echo "=== Postgres Logs ==="
          docker logs marad_ccb_postgres --tail 100 || true
          for svc in event_store_service user_service submitter_service investigation_service voter_service decision_maker_service notification_service attachment_service; do
            echo "=== Logs for $svc ==="
            docker logs "$svc" --tail 100 || true
          done
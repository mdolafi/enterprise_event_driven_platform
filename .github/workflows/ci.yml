name: Platform CI - Build & Integration Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  actions: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # ---------------------------------------------------------------------------
  # Phase 1: Lint & Code Style Checks
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Code Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Root Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          elif [ -f "package.json" ]; then
            npm install
          fi

      - name: Run Linter
        run: |
          if [ -f "package.json" ]; then
            npm run lint --if-present
          fi

  # ---------------------------------------------------------------------------
  # Phase 2: Parallel Container Builds with GHA Layer Caching
  # ---------------------------------------------------------------------------
  build-services:
    name: Build Image - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user_service
          - submitter_service
          - event_store_service
          - investigation_service
          - voter_service
          - decision_maker_service
          - notification_service
          - attachment_service
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Prepare Service Build Directory
        run: |
          TARGET_DIR="./services/${{ matrix.service }}"

          # Ensure a fallback .env exists inside the service directory for Docker COPY .env ./
          if [ ! -f "$TARGET_DIR/.env" ]; then
            if [ -f "$TARGET_DIR/.env.example" ]; then
              cp "$TARGET_DIR/.env.example" "$TARGET_DIR/.env"
            elif [ -f "./.env.example" ]; then
              cp "./.env.example" "$TARGET_DIR/.env"
            else
              touch "$TARGET_DIR/.env"
            fi
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Normalize Repository Owner to Lowercase
        run: |
          echo "IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.service }}:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      

  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Phase 3: E2E Integration Suite Execution
  # ---------------------------------------------------------------------------
  e2e-test:
    name: E2E Integration Suite
    runs-on: ubuntu-latest
    needs: [lint, build-services]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Test Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          elif [ -f "package.json" ]; then
            npm install
          fi

      - name: Normalize Repository Owner to Lowercase
        run: |
          echo "IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Docker Network
        run: docker network create marad_ccb_network || true

      - name: Pull and Launch Microservices Against RDS
        env:
          RDS_USER: ${{ secrets.RDS_USER }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          RDS_CLUSTER_SUFFIX: ${{ secrets.RDS_CLUSTER_SUFFIX }}
          RDS_PORT: ${{ secrets.RDS_PORT || '5432' }}
        run: |
          # Format: service_name:port:rds_prefix
          SERVICES=(
            "user_service:8000:user"
            "submitter_service:8001:submitter"
            "voter_service:8002:voter"
            "decision_maker_service:8003:decision"
            "notification_service:8004:notification"
            "investigation_service:8005:investigation"
            "attachment_service:8006:attachment"
            "event_store_service:8007:event-store"
          )

          for entry in "${SERVICES[@]}"; do
            IFS=":" read -r SVC PORT RDS_NAME <<< "$entry"

            echo "=== Pulling $SVC from GHCR ==="
            docker pull "ghcr.io/${{ env.IMAGE_OWNER }}/$SVC:latest"

            DB_HOST="dev-platform-${RDS_NAME}-db.${RDS_CLUSTER_SUFFIX}"
            DB_URL="postgresql://${RDS_USER}:${RDS_PASSWORD}@${DB_HOST}:${RDS_PORT}/postgres?sslmode=no-verify"

            echo "=== Launching $SVC on port $PORT ==="
            docker run -d \
              --name "$SVC" \
              --network marad_ccb_network \
              -e DATABASE_URL="$DB_URL" \
              -e PORT="$PORT" \
              -p "${PORT}:${PORT}" \
              "ghcr.io/${{ env.IMAGE_OWNER }}/$SVC:latest"
          done

          echo "Waiting 10 seconds for services to initialize database pools..."
          sleep 10

      - name: Run 7-Stage E2E Integration Suite
        run: |
          npx jest tests/e2e/caseLifecycle.e2e.test.js --runInBand --verbose

      - name: Dump Container Logs on Failure
        if: always()
        run: |
          for svc in user_service submitter_service voter_service decision_maker_service notification_service investigation_service attachment_service event_store_service; do
            echo "=== Logs for $svc ==="
            docker logs "$svc" --tail 100 || true
          done